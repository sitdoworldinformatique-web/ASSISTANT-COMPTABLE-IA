<style>
:root{
 --bg:#f3f5f8;--card:#fff;--ink:#14202e;--mut:#64707f;--line:#e2e7ee;--soft:#eef2f7;
 --acc:#0f766e;--acc2:#e0f2f1;--gold:#b7791f;--ok:#15803d;--okbg:#e7f6ec;--bad:#b42318;--badbg:#fdecea;

}

 --acc:#2dd4bf;--acc2:#123b3a;--gold:#f6c065;--ok:#4ade80;--okbg:#10301e;--bad:#f87171;--badbg:#3a1616;
 --side:#070d18;--sideink:#9aa8bb;--shadow:none;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.shell>div{min-width:0}
aside{background:var(--side);color:var(--sideink);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:17px;padding:4px 8px 18px}
.logo i{font-style:normal;display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#14b8a6,#b7791f);font-size:17px}
.logo small{display:block;font-weight:500;font-size:11px;color:var(--sideink);letter-spacing:.06em}
nav{display:flex;flex-direction:column;gap:2px}
nav button{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--sideink);padding:9px 10px;cursor:pointer;font:inherit;font-size:14px;border-radius:8px;text-align:left;white-space:nowrap}
nav button:hover{background:rgba(255,255,255,.06);color:#fff}
nav button.on{background:rgba(45,212,191,.16);color:#fff}
nav button span{width:22px;text-align:center}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 24px;border-bottom:1px solid var(--line);background:var(--card)}
.top h1{font-size:19px;margin:0;margin-right:auto}
.top #theme{order:2}
.per{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut);flex-wrap:wrap}
.per input{width:auto;padding:6px 8px}
main{padding:20px 24px;max-width:1150px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:16px}
.kpi{margin:0;position:relative;overflow:hidden}
.kpi span{color:var(--mut);font-size:13px}.kpi b{display:block;font-size:22px;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi em{font-style:normal;font-size:12px;color:var(--mut)}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--acc))}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:13px;background:var(--soft)}
tr.tot th{background:none;color:var(--ink)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
a{color:var(--acc)}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--card);color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:-1px}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;padding:9px 14px;border-radius:8px;cursor:pointer;font:inherit;font-size:14px;background:var(--soft);color:var(--ink)}
.btn.p{background:var(--acc);color:#fff}:root[data-theme="dark"] .btn.p{color:#04201d}
.btn.sm{padding:5px 9px;font-size:13px}
.btn.x{background:none;color:var(--bad);padding:4px 6px}
.icon{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 9px;cursor:pointer;color:var(--ink);font:inherit;font-size:13px}
.f{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:12px}
.f .w2{grid-column:span 2}
.row{display:grid;gap:8px;grid-template-columns:2fr 1fr 1fr auto;margin-bottom:6px}
.msg{padding:9px 12px;border-radius:8px;margin-top:10px;font-size:14px}.ok{background:var(--okbg);color:var(--ok)}.bad{background:var(--badbg);color:var(--bad)}
h2{margin:0 0 14px;font-size:16px}.hide{display:none!important}.mut{color:var(--mut)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}.head h2{margin:0;margin-right:auto}
.cols{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--mut);font-weight:500}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.bad{background:var(--badbg);color:var(--bad)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--soft);padding:4px;border-radius:10px;width:fit-content;max-width:100%;margin-bottom:14px}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:7px;cursor:pointer;font:inherit;font-size:14px;color:var(--mut)}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.hint{background:var(--acc2);color:var(--ink);border-radius:8px;padding:8px 12px;font-size:14px;margin-bottom:10px}
.legend{display:flex;gap:14px;font-size:13px;color:var(--mut)}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
#toast{position:fixed;right:16px;bottom:16px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;z-index:50}

.modal{position:fixed;inset:0;background:rgba(5,10,20,.55);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:70}
.modal .card{width:100%;max-width:720px}

.plan{text-align:center;position:relative;overflow:visible;margin-top:10px}
.plan .prix{font-size:32px;font-weight:700;color:var(--acc);margin:6px 0 2px}
.plan.pop{border:2px solid var(--acc)}
.plan .badge{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--acc);color:#fff;font-size:12px;padding:2px 10px;border-radius:99px;white-space:nowrap}

 nav{flex-direction:row;overflow-x:auto;padding-bottom:4px}
 .top{padding:12px 16px}main{padding:16px}
 .f .w2{grid-column:auto}
 .top #theme{order:0}.per{width:100%;order:3}

}
@media (max-width:600px){.row{grid-template-columns:1fr 1fr!important}.row>*:first-child,#lib{grid-column:1/-1}.inv{padding:16px}}
@media print{
 aside,.top,.noprint,button,#toast,.banner,.gate{display:none!important}
 .shell{display:block}main{padding:0;max-width:none}
 .card{border:0;box-shadow:none;padding:0}
 .printhead{display:block;margin-bottom:12px}
 body{background:#fff;color:#000}
 body.mopen .shell{display:none}

}

<script id="moteur">
// ---------- Moteur comptable ----------
// Calculs purs, sans écran ni stockage : testés par tests/moteur.test.js.
// Les montants restent enregistrés en unités (ex. 1234.5), mais toutes les sommes se font en centimes entiers
// pour éviter les erreurs d'arrondi des nombres à virgule.
const Moteur=(()=>{
  "use strict";
  // 1.005 * 100 vaut 100.4999… en virgule flottante : le petit décalage corrige ce cas.
  const enCentimes=n=>{const v=Number(n);if(!isFinite(v))return 0;return Math.sign(v)*Math.round(Math.abs(v)*100+1e-6)};
  const enUnites=c=>(c||0)/100;
  const arrondir=n=>enUnites(enCentimes(n));
  const classe=c=>String(c)[0];
  const somme=(lignes,k)=>lignes.reduce((a,l)=>a+enCentimes(l[k]||0),0);
  const equilibree=lignes=>somme(lignes,"debit")===somme(lignes,"credit");

  // Contrôle des lignes d'une écriture ; existe(compte) dit si le compte est dans le plan.
  function verifierLignes(L,existe){
    const err=[];
    if(L.length<2)err.push("Au moins deux lignes.");
    L.forEach((l,i)=>{
      const n="Ligne "+(i+1)+" : ";
      if(!l.compte)err.push(n+"compte manquant.");
      else if(existe&&!existe(l.compte))err.push(n+"compte "+l.compte+" absent du plan (vous pouvez l'ajouter dans « Plan comptable »).");
      if(l.debit<0||l.credit<0)err.push(n+"pas de montant négatif.");
      if(l.debit&&l.credit)err.push(n+"mettez soit un débit, soit un crédit, pas les deux.");
      if(!l.debit&&!l.credit)err.push(n+"montant manquant.");
    });
    if(!equilibree(L))err.push("Débit et crédit doivent être égaux.");
    return err;
  }

  // Totaux débit / crédit par compte, recalculés à partir des seules écritures.
  function soldes(ecritures){
    const cts={};
    ecritures.forEach(e=>e.lignes.forEach(l=>{
      const s=cts[l.compte]=cts[l.compte]||{d:0,c:0};
      s.d+=enCentimes(l.debit||0);s.c+=enCentimes(l.credit||0);
    }));
    const s={};
    Object.keys(cts).forEach(c=>s[c]={d:enUnites(cts[c].d),c:enUnites(cts[c].c)});
    return s;
  }
  const sd=(s,c)=>arrondir((s[c]?.d||0)-(s[c]?.c||0));

  function resultat(ecritures){
    let prod=0,ch=0,hao=0;
    ecritures.forEach(e=>e.lignes.forEach(l=>{
      const k=classe(l.compte),net=enCentimes(l.credit||0)-enCentimes(l.debit||0);
      if(k==="7")prod+=net;
      if(k==="6")ch-=net;
      if(k==="8")hao+=net;
    }));
    return {prod:enUnites(prod),ch:enUnites(ch),hao:enUnites(hao),res:enUnites(prod-ch+hao)};
  }

  // Bilan simplifié : chaque compte de classe 1 à 5 va à l'actif ou au passif selon son solde.
  function bilan(ecritures){
    const s=soldes(ecritures),actif=[],passif=[];
    Object.keys(s).sort().forEach(c=>{
      const k=classe(c),v=enCentimes(sd(s,c));
      if("678".includes(k)||v===0)return;
      if(k==="1")passif.push([c,-v]);                  // capitaux, emprunts
      else if(k==="2"||k==="3")actif.push([c,v]);      // immobilisations (amortissements en moins), stocks
      else if(v>0)actif.push([c,v]);                   // créances, trésorerie positive
      else passif.push([c,-v]);                        // dettes, découvert
    });
    const r=enCentimes(resultat(ecritures).res);
    const ta=actif.reduce((a,x)=>a+x[1],0),tp=passif.reduce((a,x)=>a+x[1],0)+r;
    const u=L=>L.map(([c,v])=>[c,enUnites(v)]);
    return {actif:u(actif),passif:u(passif),r:enUnites(r),ta:enUnites(ta),tp:enUnites(tp),equilibre:ta===tp};
  }

  function balance(ecritures){
    const s=soldes(ecritures);let td=0,tc=0;
    const lignes=Object.keys(s).sort().map(c=>{td+=enCentimes(s[c].d);tc+=enCentimes(s[c].c);return {compte:c,d:s[c].d,c:s[c].c,solde:sd(s,c)}});
    return {lignes,td:enUnites(td),tc:enUnites(tc),equilibre:td===tc};
  }

  // Grand livre d'un compte : solde d'ouverture (écritures avant « du »), mouvements de la période, solde courant.
  function grandLivre(ecritures,compte,du,au){
    let ouv=0,solde=0,td=0,tc=0;const mouvements=[];
    [...ecritures].sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>e.lignes.forEach(l=>{
      if(l.compte!==compte)return;
      const d=enCentimes(l.debit||0),c=enCentimes(l.credit||0);
      if(du&&e.date<du){ouv+=d-c;return}
      if(au&&e.date>au)return;
      if(!mouvements.length)solde=ouv;
      solde+=d-c;td+=d;tc+=c;
      mouvements.push({e,l,solde:enUnites(solde)});
    }));
    if(!mouvements.length)solde=ouv;
    return {ouverture:enUnites(ouv),mouvements,td:enUnites(td),tc:enUnites(tc),cloture:enUnites(solde)};
  }

  // Facture de vente sur une ligne : TVA et TTC arrondis au centime.
  function calculFacture(ht,taux){
    const h=enCentimes(ht),tva=Math.round(h*(Number(taux)||0)/100);
    return {ht:enUnites(h),tva:enUnites(tva),ttc:enUnites(h+tva)};
  }
  function lignesFacture({ht,tva,ttc,compte}){
    const L=[{compte:"411",debit:ttc,credit:0},{compte,debit:0,credit:ht}];
    if(enCentimes(tva))L.push({compte:"4431",debit:0,credit:tva});
    return L;
  }

  // Contrôle d'une sauvegarde avant restauration : structure, dates, comptes, montants, équilibre.
  // Les identifiants et numéros sont insérés dans la page : ils doivent rester de simples codes.
  const CODE=/^[A-Za-z0-9_-]{1,40}$/,DATE=/^\d{4}-\d{2}-\d{2}$/,COMPTE=/^[1-9]\d{1,7}$/;
  const montantOk=v=>v===undefined||v===null||(typeof v==="number"&&isFinite(v)&&v>=0);
  function controleSauvegarde(d){
    const err=[];
    if(!d||typeof d!=="object"||!Array.isArray(d.ecritures)||!Array.isArray(d.factures))return ["Ce fichier n'est pas une sauvegarde CompteAssist."];
    d.ecritures.forEach((e,i)=>{
      const n=`Écriture ${i+1} : `;
      if(!e||typeof e!=="object"){err.push(n+"illisible.");return}
      if(e.id!==undefined&&!CODE.test(String(e.id)))err.push(n+"identifiant invalide.");
      if(!DATE.test(String(e.date)))err.push(n+"date invalide.");
      if(!Array.isArray(e.lignes)||e.lignes.length<2){err.push(n+"au moins deux lignes requises.");return}
      if(e.lignes.some(l=>!l||!COMPTE.test(String(l.compte))))err.push(n+"numéro de compte invalide.");
      if(e.lignes.some(l=>l&&(!montantOk(l.debit)||!montantOk(l.credit))))err.push(n+"montant invalide.");
      else if(!equilibree(e.lignes))err.push(n+"débit et crédit ne sont pas égaux.");
    });
    d.factures.forEach((f,i)=>{
      const n=`Facture ${i+1} : `;
      if(!f||!CODE.test(String(f.num)))err.push(n+"numéro invalide.");
      else if(!["ht","tva","ttc"].every(k=>montantOk(f[k])))err.push(n+"montant invalide.");
    });
    if(d.comptes!==undefined&&(!Array.isArray(d.comptes)||d.comptes.some(c=>!c||!COMPTE.test(String(c.num)))))err.push("Plan comptable : numéro de compte invalide.");
    return err;
  }

  return {enCentimes,enUnites,arrondir,somme,equilibree,verifierLignes,soldes,sd,resultat,bilan,balance,grandLivre,calculFacture,lignesFacture,controleSauvegarde};
})();
if(typeof module==="object"&&module.exports)module.exports=Moteur;
</script>

function graphique(){
  const fin=ui.au||today();let y=+fin.slice(0,4),m=+fin.slice(5,7);const mois=[];
  for(let i=0;i<6;i++){mois.unshift(`${y}-${String(m).padStart(2,"0")}`);if(--m===0){m=12;y--}}
  const data=mois.map(k=>{let p=0,c=0;db.ecritures.filter(e=>e.date.startsWith(k)).forEach(e=>e.lignes.forEach(l=>{
    if(classe(l.compte)==="7")p+=(l.credit||0)-(l.debit||0);if(classe(l.compte)==="6")c+=(l.debit||0)-(l.credit||0)}));return {k,p:Math.max(p,0),c:Math.max(c,0)}});
  const max=Math.max(1,...data.flatMap(d=>[d.p,d.c]));
  const W=520,H=190,bw=24,gx=W/6,NOMS=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
  const bars=data.map((d,i)=>{const x=i*gx+gx/2,hp=d.p/max*(H-40),hc=d.c/max*(H-40);
   return `<rect x="${x-bw-2}" y="${H-22-hp}" width="${bw}" height="${hp}" rx="4" fill="var(--ok)"><title>Recettes ${fmt(d.p)}</title></rect>
    <rect x="${x+2}" y="${H-22-hc}" width="${bw}" height="${hc}" rx="4" fill="var(--bad)" opacity=".8"><title>Dépenses ${fmt(d.c)}</title></rect>
    <text x="${x}" y="${H-5}" text-anchor="middle" font-size="12" fill="var(--mut)">${NOMS[+d.k.slice(5)-1]}</text>`}).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Recettes et dépenses par mois"><line x1="0" x2="${W}" y1="${H-22}" y2="${H-22}" stroke="var(--line)"/>${bars}</svg>
   <div class="legend"><span><i style="background:var(--ok)"></i>Recettes</span><span><i style="background:var(--bad)"></i>Dépenses</span></div>`;
}

function supprimer(id){
  const e=db.ecritures.find(x=>x.id===id);if(!e)return;
  const lien=lienFacture(e);
  if(lien&&lien.type==="facture"&&lien.f.payee){alert(`La facture ${lien.f.num} est déjà encaissée. Supprimez d'abord l'écriture d'encaissement, puis celle de la facture.`);return}
  if(!confirm(`Supprimer l'écriture « ${e.libelle} » du ${dfr(e.date)} ?${lien?`\nLa facture ${lien.f.num} passera en « ${lien.type==="facture"?"Annulée":"À encaisser"} ».`:""}`))return;
  db.ecritures=db.ecritures.filter(x=>x.id!==id);
  if(lien&&lien.type==="facture")lien.f.annulee=true;
  if(lien&&lien.type==="encaissement")lien.f.payee=null;
  save();toast("Écriture supprimée");go("journal");
}
// Lien entre une écriture et sa facture (type « facture » ou « encaissement »).
// Les anciennes écritures n'ont pas le champ « lien » : on le retrouve par le n° de pièce et le libellé.
function lienFacture(e){
  const f=db.factures.find(x=>x.num===e.piece);if(!f||f.annulee)return null;
  const type=e.lien||(e.libelle.startsWith("Facture ")?"facture":e.libelle.startsWith("Encaissement ")?"encaissement":null);
  return type?{f,type}:null;
}
const montant411=(L,k)=>Moteur.enUnites(Moteur.somme(L.filter(l=>l.compte==="411"),k));
function verifFacture({f,type},piece,L){
  const err=[];
  if(piece!==f.num)err.push(`Cette écriture est liée à la facture ${esc(f.num)} : gardez le n° de pièce ${esc(f.num)}.`);
  if(type==="facture"){
    const ttc=montant411(L,"debit"),ht=Moteur.enUnites(Moteur.somme(L.filter(l=>classe(l.compte)==="7"),"credit"));
    if(ttc<=0||ht<=0)err.push("L'écriture d'une facture doit garder un débit au compte 411 (client) et un crédit en classe 7 (vente).");
    else if(f.payee&&Math.abs(ttc-f.ttc)>=0.005)err.push(`La facture ${esc(f.num)} est déjà encaissée pour ${money(f.ttc)} : supprimez d'abord l'encaissement pour changer son montant.`);
  }else if(Math.abs(montant411(L,"credit")-f.ttc)>=0.005)err.push(`L'encaissement doit créditer le compte 411 du montant de la facture (${money(f.ttc)}).`);
  return err;
}
function majFacture({f,type},e){
  e.lien=type;
  if(type==="encaissement"){f.payee=e.date;return}
  const L=e.lignes,ventes=L.filter(l=>classe(l.compte)==="7");
  f.date=e.date;
  f.ttc=montant411(L,"debit");
  const tva=L.filter(l=>l.compte==="4431");
  f.ht=Moteur.enUnites(Moteur.somme(ventes,"credit"));
  f.tva=Moteur.enUnites(Moteur.somme(tva,"credit")-Moteur.somme(tva,"debit"));
  f.taux=f.ht?arr(f.tva/f.ht*100):0;
  f.compte=ventes[0].compte;
  if(e.libelle.startsWith("Facture ")&&e.libelle.slice(8).trim())f.client=e.libelle.slice(8).trim();
}
// Avertit avant qu'une écriture fasse passer la caisse, la banque ou le Mobile Money en négatif à sa date.
function tresoOk(L,date,sauf){
  const s=soldes(db.ecritures.filter(x=>x.id!==sauf&&x.date<=date));
  const neg=TRESO.filter(([c])=>L.some(l=>l.compte===c&&l.credit>0))
    .map(([c,n])=>{const M=L.filter(l=>l.compte===c);return [n,arr(sd(s,c)+Moteur.enUnites(Moteur.somme(M,"debit")-Moteur.somme(M,"credit")))]})
    .filter(x=>x[1]<=-0.005);
  if(!neg.length)return true;
  return confirm(neg.map(([n,v])=>`⚠️ ${n} : le solde passerait à ${fmt(v)} ${db.params.devise} au ${dfr(date)}.`).join("\n")+"\n\nIl n'y a pas assez d'argent sur ce compte à cette date. Enregistrer quand même ?");
}

function facturer(){
  const ht=arr(parseFloat($("fh").value)||0),t=parseFloat($("ft").value)||0,cl=$("fc").value.trim(),date=$("fd").value,objet=$("fo").value.trim(),compte=$("fk").value;

  if(t<0||t>100){out.innerHTML=`<div class="msg bad">Le taux de TVA doit être entre 0 et 100 %.</div>`;return}
  const {tva,ttc}=Moteur.calculFacture(ht,t),num=prochainNum();

function voirFacture(num){
  const f=db.factures.find(x=>x.num===num);if(!f)return;const p=db.params,[st]=factStatut(f);

function telecharger(nomFichier,contenu,type){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([contenu],{type}));
  a.download=nomFichier;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}

const csv=lignes=>"﻿"+lignes.map(l=>l.map(cel).join(";")).join("\r\n");

function restaurer(input){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      const err=Moteur.controleSauvegarde(d);
      if(err.length){$("sres").innerHTML=`<div class="msg bad">Sauvegarde refusée, rien n'a été modifié :<br>${err.slice(0,8).map(esc).join("<br>")}${err.length>8?`<br>… et ${err.length-8} autre(s) problème(s).`:""}</div>`;return}
      if(!confirm(`Remplacer les données actuelles par cette sauvegarde (${d.ecritures.length} écriture(s), ${d.factures.length} facture(s)) ?`))return;
      db=normaliser(d);save();go("dashboard");toast("Sauvegarde restaurée ✔");
    }catch(e){$("sres").innerHTML=`<div class="msg bad">Ce fichier n'est pas une sauvegarde CompteAssist valide.</div>`}
    finally{input.value=""}
  };
  r.readAsText(f);
}

// Parcours : inscription -> choix de la formule -> paiement -> assistant comptable.
// Attention : tout est enregistré dans ce navigateur. Un vrai contrôle (comptes, paiements) demande un serveur.
// Tant que PAIEMENT_REEL vaut false, le paiement est SIMULÉ (mode test, aucun argent n'est prélevé).
const PAIEMENT_REEL=false;
const ACCKEY="compteassist.acces",HEURE=3600000,JOUR=86400000;
const PLANS=[
 {id:"t0",nom:"Test",prix:0,duree:HEURE,detail:"1 heure, une seule fois"},
 {id:"s1",nom:"1 semaine",prix:5,duree:7*JOUR},

 {id:"a1",nom:"1 an",prix:120,duree:365*JOUR},
 {id:"a2",nom:"2 ans",prix:200,duree:730*JOUR}
];
const MOYENS=[["mpesa","M-Pesa"],["orange","Orange Money"],["airtel","Airtel Money"],["mtn","MTN Mobile Money"],["moov","Moov Money"],["wave","Wave"],["carte","Carte bancaire"]];
let acces={};
try{acces=JSON.parse(localStorage.getItem(ACCKEY)||"{}")||{}}catch(e){acces={}}
const saveAcces=()=>{try{localStorage.setItem(ACCKEY,JSON.stringify(acces))}catch(e){}};
const abonneActif=()=>!!(acces.connecte&&acces.abo&&acces.abo.fin>Date.now());
const accesLibre=abonneActif;
const testUtilise=()=>!!acces.testUtilise;
function resteTexte(){
  const ms=acces.abo.fin-Date.now();
  if(ms<HEURE)return Math.ceil(ms/60000)+" min";
  if(ms<2*JOUR)return Math.ceil(ms/HEURE)+" h";
  return "jusqu'au "+new Date(acces.abo.fin).toLocaleDateString("fr-FR");
}
let payPlan=null;
async function hacher(t){
  try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("compteassist|"+t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
  catch(e){let h=2166136261;for(const ch of "compteassist|"+t){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return "f"+(h>>>0).toString(16)}
}
function etatAcces(){
  const b=$("banner");
  if(abonneActif()){
    const p=PLANS.find(x=>x.id===acces.abo.plan)||{nom:""};
    b.innerHTML=`✅ Formule <b>${esc(p.nom)}</b> active · ${resteTexte()}${PAIEMENT_REEL?"":' <span class="tag">mode test</span>'} <button class="btn sm" onclick="go('tarifs')">Prolonger</button>`;
    b.classList.remove("hide");
  }else b.classList.add("hide");
  const g=$("gate");
  if(accesLibre()&&!payPlan){g.classList.add("hide");g.innerHTML="";g.dataset.vue="";document.body.style.overflow="";return}
  g.classList.remove("hide");document.body.style.overflow="hidden";
  if(!g.innerHTML)afficherPorte();
}

  let h;
  if(vue==="inscription")h=`<div style="max-width:460px;margin:0 auto">${logo}${etapes(0)}<div class="card">${formInscription()}</div></div>`;

     <div class="card" style="text-align:center;max-width:820px;margin:0 auto 16px"><h2 style="font-size:20px">${expire?"Votre formule est terminée":"Choisissez votre formule"}</h2>

     ${blocTarifs()}
     <div class="bar" style="justify-content:center">${db.ecritures.length?`<button class="btn" onclick="sauvegarder()">⬇ Télécharger mes données</button>`:""}<button class="btn" onclick="deconnexion()">Se déconnecter</button></div></div>`;

async function inscrire(){
  const v=k=>$("i_"+k).value.trim(),out=$("i_res"),err=[];
  if(!v("nom"))err.push("Nom requis.");
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v("email")))err.push("E-mail invalide.");
  if(!pays(v("pays")))err.push("Choisissez votre pays.");
  else if(!numeroIntl(v("pays"),v("tel")))err.push("Numéro de téléphone invalide pour ce pays (6 à 12 chiffres, sans l'indicatif).");
  if($("i_mdp").value.length<6)err.push("Mot de passe trop court (6 caractères minimum).");
  if($("i_mdp").value!==$("i_mdp2").value)err.push("Les deux mots de passe ne sont pas identiques.");
  if(acces.compte&&acces.compte.email===v("email").toLowerCase())err.push("Un compte existe déjà avec cet e-mail : connectez-vous.");
  if(err.length){out.innerHTML=`<div class="msg bad">${err.join("<br>")}</div>`;return}
  acces.compte={nom:v("nom"),email:v("email").toLowerCase(),tel:numeroIntl(v("pays"),v("tel")),pays:pays(v("pays"))[1],paysCode:v("pays"),mdp:await hacher($("i_mdp").value),cree:Date.now()};
  acces.connecte=true;saveAcces();
  // Premier dossier : le pays et sa devise deviennent les paramètres de l'entreprise (modifiables ensuite).
  if(!db.ecritures.length&&!db.params.pays){const x=pays(v("pays"));db.params.pays=x[0];db.params.devise=x[3];if(!db.params.tel)db.params.tel=acces.compte.tel;save()}
  toast("Compte créé ✔");
  afficherPorte("tarifs");
}
async function connecter(){
  const e=$("c_email").value.trim().toLowerCase(),h=await hacher($("c_mdp").value);
  if(!acces.compte||acces.compte.email!==e||acces.compte.mdp!==h){$("c_res").innerHTML=`<div class="msg bad">E-mail ou mot de passe incorrect.</div>`;return}
  acces.connecte=true;saveAcces();toast("Connecté ✔");
  if(accesLibre()){$("gate").innerHTML="";go(ui.vue==="tarifs"?"dashboard":ui.vue)}else afficherPorte("tarifs");

function formPaiement(){
  const p=PLANS.find(x=>x.id===payPlan);
  const debut=abonneActif()?acces.abo.fin:Date.now();
  const fin=new Date(debut+p.duree);
  const recap=`<div class="hint" style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><span>Formule <b>${esc(p.nom)}</b>${p.detail?` (${p.detail})`:""}</span><b>${p.prix} $</b></div>
   <p class="mut" style="margin:0 0 12px">Accès ${p.duree<JOUR?"pendant 1 heure":"jusqu'au "+fin.toLocaleDateString("fr-FR")}.</p>`;
  if(p.prix===0)return `<h2>Confirmer la formule test</h2>${recap}
   <div class="bar"><button class="btn p" onclick="payer()">Commencer le test gratuit</button><button class="btn" onclick="annulerPaiement()">Retour aux formules</button></div>`;
  return `<h2>Paiement</h2>${recap}
   ${PAIEMENT_REEL?"":`<div class="msg bad" style="margin:0 0 12px">🧪 <b>Mode test</b> : le paiement est simulé, aucun argent n'est prélevé.</div>`}
   <div class="f" style="grid-template-columns:1fr">
    <div><label>Moyen de paiement</label><select id="pm" onchange="$('pz').innerHTML=champPaiement(this.value)">${MOYENS.map(([k,n])=>`<option value="${k}">${n}</option>`).join("")}</select></div>
    <div id="pz">${champPaiement("mpesa")}</div>
   </div>
   <div class="bar"><button class="btn p" onclick="payer()">${PAIEMENT_REEL?"Payer":"Simuler le paiement"} ${p.prix} $</button><button class="btn" onclick="annulerPaiement()">Retour aux formules</button></div><div id="pres"></div>`;
}
const champPaiement=m=>m==="carte"?`<label>Carte bancaire</label><p class="mut" style="margin:0">Vous serez redirigé vers la page sécurisée de paiement par carte.</p>`
  :`<label>Numéro ${esc((MOYENS.find(x=>x[0]===m)||[])[1]||"")}</label><input id="ptel" type="tel" placeholder="${indicatif(acces.compte?.paysCode||db.params.pays)||"+"}…" value="${esc(acces.compte?.tel||"")}"><p class="mut" style="margin:4px 0 0;font-size:13px">Vous recevrez une demande de confirmation sur votre téléphone.</p>`;
function annulerPaiement(){payPlan=null;$("gate").innerHTML="";etatAcces();if(!accesLibre())afficherPorte("tarifs");else go("tarifs")}
function payer(){
  const p=PLANS.find(x=>x.id===payPlan);if(!p)return;
  if(p.prix>0){
    const m=$("pm").value;
    if(m!=="carte"&&($("ptel").value.replace(/\D/g,"").length<8)){$("pres").innerHTML=`<div class="msg bad">Numéro de téléphone invalide.</div>`;return}
    if(PAIEMENT_REEL){$("pres").innerHTML=`<div class="msg bad">Le paiement réel n'est pas encore branché.</div>`;return}
  }
  const debut=abonneActif()?acces.abo.fin:Date.now();
  acces.abo={plan:p.id,fin:debut+p.duree};
  if(p.prix===0)acces.testUtilise=true;
  (acces.paiements=acces.paiements||[]).push({date:Date.now(),plan:p.id,montant:p.prix,moyen:p.prix?$("pm").value:"gratuit",mode:PAIEMENT_REEL?"reel":"test"});
  saveAcces();payPlan=null;$("gate").innerHTML="";
  go(db.ecritures.length?"dashboard":"saisie");
  toast(p.prix?"Paiement confirmé ✔ Bienvenue !":"Test gratuit activé ✔ Bon essai !");
}

// ---------- Navigation ----------
function go(v){
  if(!views[v])v="dashboard";
  if(v!=="saisie")edition=null;
  ui.vue=v;saveUi();fermer();
  const m=MENU.find(x=>x[0]===v);
  $("titre").textContent=m[2];document.title=m[2]+" – CompteAssist";
  $("du").value=ui.du;$("au").value=ui.au;
  $("app").innerHTML=views[v]();
  $("nav").innerHTML=MENU.map(x=>`<button class="${x[0]===v?'on':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join("");
  if(v==="saisie"){
    if($("qt"))qType();
    else{const e=edition&&db.ecritures.find(x=>x.id===edition);
      if(e)e.lignes.forEach(l=>addLigne(l.compte,l.debit||"",l.credit||""));else{addLigne();addLigne()}tot()}
  }
  window.scrollTo(0,0);
  etatAcces();
}
document.addEventListener("keydown",e=>{if(e.key==="Escape")fermer()});
appliquerTheme();
go(accesLibre()?ui.vue:"dashboard");
setInterval(etatAcces,30000);
</script>
</body>
</html>
