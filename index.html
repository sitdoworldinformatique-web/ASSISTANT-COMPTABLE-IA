<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CompteAssist – Assistant comptable SYSCOHADA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#f3f5f8;--card:#fff;--ink:#111c29;--mut:#5b6673;--line:#e2e7ee;--soft:#eef4ff;--soft2:#f6f8fb;
 --acc:#0f766e;--accd:#005c55;--acc2:#e0f2f1;--sec:#d3e1f6;--secink:#24364d;
 --gold:#945d00;--goldbg:#fef3c7;--ok:#15803d;--okbg:#e7f6ec;--bad:#b42318;--badbg:#fdecea;
 --side:#26313f;--sideink:#bdc9c6;--sideacc:#80d5cb;--bar2:#d3e1f6;
 --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 6px rgba(16,24,40,.04);
 --ff:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--fh:"Plus Jakarta Sans","Inter",system-ui,sans-serif;
 --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
:root[data-theme="dark"]{
 --bg:#0b1220;--card:#121b2b;--ink:#e6ebf2;--mut:#93a0b2;--line:#233044;--soft:#1a2537;--soft2:#162133;
 --acc:#2dd4bf;--accd:#5eead4;--acc2:#123b3a;--sec:#22324a;--secink:#d6e4f9;
 --gold:#f6c065;--goldbg:#3a2e12;--ok:#4ade80;--okbg:#10301e;--bad:#f87171;--badbg:#3a1616;
 --side:#070d18;--sideink:#9aa8bb;--sideacc:#5eead4;--bar2:#3b4a63;--shadow:none;
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 var(--ff);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--fh);letter-spacing:-.01em}
.ic{flex:none;vertical-align:middle}
.shell{display:grid;grid-template-columns:256px 1fr;min-height:100vh}
.shell>div{min-width:0}
/* Barre latérale */
aside{background:var(--side);color:var(--sideink);position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;justify-content:space-between;padding:20px 12px 14px;z-index:30}
.logo{display:flex;align-items:center;gap:10px;color:#fff;padding:0 8px 18px}
.logo i{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--acc);color:#fff;flex:none}
.logo b{display:block;font-family:var(--fh);font-size:16px;line-height:1.2}
.logo small{display:block;font-size:10.5px;font-weight:600;letter-spacing:.08em;color:var(--sideacc);text-transform:uppercase}
nav{display:flex;flex-direction:column;gap:2px}
nav button{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--sideink);padding:8px 10px;cursor:pointer;font:600 13px var(--ff);border-radius:8px;text-align:left;white-space:nowrap}
nav button:hover{background:rgba(255,255,255,.07);color:#fff}
nav button.on{background:#0f766e;color:#fff}
.sidefoot{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.sidecard{background:rgba(255,255,255,.07);border-radius:10px;padding:10px 12px;color:#fff;font-size:13px;border:0;text-align:left;font-family:var(--ff);cursor:pointer;display:block;width:100%}
.sidecard:hover{background:rgba(255,255,255,.11)}
.sidecard small{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--sideink)}
.sidecard .row2{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;background:#945d00;color:#fff;white-space:nowrap}
.pill.t{background:rgba(255,255,255,.14)}
/* Barre du haut */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 24px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:20;min-height:64px}
.crumb{font-size:13px;color:var(--mut);margin-right:4px}.crumb b{color:var(--ink)}
#titre{font-size:13px;margin:0;font-weight:700;font-family:var(--ff);display:inline}
.per{display:flex;align-items:center;gap:6px;background:var(--soft);border-radius:10px;padding:4px 6px 4px 10px;font-size:12px;color:var(--mut);flex-wrap:wrap}
.per input{width:auto;padding:4px 6px;border:0;background:transparent;font-size:12.5px}
.sp{flex:1}
.ib{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;border:0;background:none;color:var(--ink);cursor:pointer}
.ib:hover{background:var(--soft)}
.av{width:36px;height:36px;border-radius:50%;background:var(--accd);color:#fff;border:0;font:700 13px var(--ff);cursor:pointer;display:grid;place-items:center}
main{padding:24px;max-width:1440px}
/* Composants */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:20px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
h2{margin:0 0 14px;font-size:17px;font-weight:600}
.sub{color:var(--mut);font-size:13px;margin:-10px 0 14px}
.mic{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}
.mut{color:var(--mut)}.hide{display:none!important}
.num{font-variant-numeric:tabular-nums}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:20px}
.cols{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.c2{display:grid;gap:20px;grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr);align-items:start}
.c2>*{min-width:0}
.kpi{margin:0;position:relative;border-left:4px solid var(--c,var(--acc));display:flex;flex-direction:column;gap:6px;padding:16px 16px 14px}
.kpi .v{font:700 24px/1.15 var(--ff);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:13px;font-weight:600;color:var(--mut);margin-left:4px}
.kpi .d{font-size:12px;color:var(--mut)}
.kpi .lt{display:flex;justify-content:space-between;align-items:center;gap:6px}
.kl{display:flex;justify-content:space-between;gap:8px;background:var(--soft2);border-radius:6px;padding:3px 8px;font-size:12px}
.kl b{font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:11px;letter-spacing:.05em;text-transform:uppercase;background:var(--soft)}
tbody tr:hover td,table tr:hover td{background:color-mix(in srgb,var(--soft) 45%,transparent)}
tr.tot th{background:var(--soft);color:var(--ink);font-size:13px;text-transform:none;letter-spacing:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pc{display:inline-block;font:700 11px var(--mono);background:var(--soft);color:var(--secink);padding:2px 6px;border-radius:4px;white-space:nowrap}
.cpt{font:700 12.5px var(--mono);color:var(--ink);background:none;border:0;padding:0;cursor:pointer}
.cpt.k5{color:var(--acc)}.cpt.k6{color:var(--bad)}.cpt.k7{color:var(--ok)}.cpt.k1{color:var(--gold)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--mut)}
.deb{color:var(--bad)}.cre{color:var(--ok)}
a{color:var(--acc);font-weight:600;text-decoration:none}a:hover{text-decoration:underline}
label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:6px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid transparent;border-radius:8px;font:inherit;background:var(--soft);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px;background:var(--card)}
input:disabled{opacity:.6}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;padding:9px 14px;border-radius:8px;cursor:pointer;font:600 13.5px var(--ff);background:var(--sec);color:var(--secink);white-space:nowrap}
.btn:hover{filter:brightness(.97)}
.btn.p{background:var(--acc);color:#fff}.btn.p:hover{background:var(--accd)}
:root[data-theme="dark"] .btn.p{color:#04201d}
.btn.o{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn.x{background:none;color:var(--mut);padding:4px 6px}.btn.x:hover{color:var(--bad)}
.btn.w{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 9px;cursor:pointer;color:var(--ink);font:inherit;font-size:13px}
.f{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:14px}
.f .w2{grid-column:span 2}
.row{display:grid;gap:8px;grid-template-columns:2fr 1fr 1fr auto;margin-bottom:6px}
.msg{padding:10px 14px;border-radius:8px;margin:0 0 14px;font-size:13.5px;display:flex;gap:8px;align-items:flex-start}
.msg+.msg{margin-top:-6px}
#qres .msg,#res .msg,#fres .msg,#sres .msg,#cres .msg,#i_res .msg,#c_res .msg,#pres .msg{margin:12px 0 0}
.ok{background:var(--okbg);color:var(--ok)}.bad{background:var(--badbg);color:var(--bad)}.warn{background:var(--goldbg);color:var(--gold)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}.head h2{margin:0;margin-right:auto}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--soft);color:var(--mut);letter-spacing:.02em;white-space:nowrap}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.bad{background:var(--badbg);color:var(--bad)}.tag.warn{background:var(--goldbg);color:var(--gold)}.tag.acc{background:var(--acc2);color:var(--accd)}
:root[data-theme="dark"] .tag.acc{color:var(--acc)}
.tabs,.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--soft);padding:4px;border-radius:10px;width:fit-content;max-width:100%}
.tabs button,.seg button{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:8px 14px;border-radius:7px;cursor:pointer;font:600 13px var(--ff);color:var(--mut)}
.tabs button.on{background:var(--acc);color:#fff}
:root[data-theme="dark"] .tabs button.on{color:#04201d}
.seg.s button{padding:4px 10px;font-size:12px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.nat{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:16px}
.nat button{display:flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:8px;padding:10px;background:var(--soft2);color:var(--mut);font:600 13.5px var(--ff);cursor:pointer}
.nat button.on.dep{background:var(--badbg);color:var(--bad)}.nat button.on.rec{background:var(--okbg);color:var(--ok)}.nat button.on.vir{background:var(--acc2);color:var(--accd)}
.hint{background:var(--acc2);color:var(--accd);border-radius:8px;padding:9px 12px;font-size:13px;font-weight:600;margin:8px 0 0;display:flex;gap:8px;align-items:center}
:root[data-theme="dark"] .hint{color:var(--acc)}
.hint.warn{background:var(--goldbg);color:var(--gold)}
.big{font:700 24px var(--ff)!important;text-align:right;letter-spacing:-.02em;padding-right:56px!important}
.money{position:relative}.money em{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;font-size:12px;font-weight:700;color:var(--mut)}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-bottom:16px}
.opt{position:relative;display:flex;gap:8px;align-items:flex-start;background:var(--soft2);border:1.5px solid transparent;border-radius:10px;padding:10px 44px 10px 10px;cursor:pointer;margin:0;font-weight:400}
.opt:has(input:checked){border-color:var(--acc);background:var(--acc2)}
.opt input{width:auto;margin:2px 0 0;accent-color:var(--acc)}
.opt span{display:flex;flex-direction:column;font-size:13px;min-width:0}.opt span b{font-weight:600}.opt span em{font-style:normal;font-size:11.5px;color:var(--mut)}
.opt code{position:absolute;right:8px;top:8px;font:700 10.5px var(--mono);background:var(--card);padding:1px 5px;border-radius:4px;color:var(--secink)}
.sim{background:var(--soft2);border-radius:10px;padding:14px;margin:4px 0 16px}
.sim table{font-size:13px}.sim th{background:none;padding:6px 8px}.sim td{padding:7px 8px;border:0}
.ptile{display:flex;align-items:center;gap:14px}
.tile{display:grid;place-items:center;width:44px;height:44px;border-radius:10px;background:var(--acc2);color:var(--accd);flex:none}
:root[data-theme="dark"] .tile{color:var(--acc)}
.tile.g{background:var(--goldbg);color:var(--gold)}.tile.r{background:var(--badbg);color:var(--bad)}.tile.v{background:var(--okbg);color:var(--ok)}
.phead{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.phead h1{font-size:22px;margin:0;line-height:1.25}
.phead p{margin:2px 0 0;color:var(--mut)}
.status{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px}
.status .tile{width:32px;height:32px;border-radius:8px}
.totbar{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;background:linear-gradient(90deg,var(--acc2),var(--soft));border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:20px}
.totbar b{font-size:18px;font-variant-numeric:tabular-nums}
.li{display:flex;align-items:center;gap:12px;background:var(--soft2);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.li .tile{width:34px;height:34px;border-radius:50%}
.li .grow{flex:1;min-width:0}.li .grow b{font-size:13.5px}.li .grow div{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .amt{text-align:right;font-size:12px;color:var(--mut);white-space:nowrap}.li .amt b{display:block;font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
.mv{border-radius:8px;background:var(--soft2);padding:10px 12px;margin-bottom:8px;font-size:12.5px}
.mv .r{display:flex;justify-content:space-between;gap:8px}
.tiles2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.tiles2>div{background:var(--soft2);border-radius:10px;padding:10px 12px}
.tiles2 b{display:block;font-size:16px;margin-top:4px;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--mut);flex-wrap:wrap}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;background:var(--soft);border-radius:8px;padding:10px 14px;margin-top:12px;font-size:13px}
.inl{display:grid;gap:8px;grid-template-columns:minmax(0,3fr) 70px 110px 110px 34px;align-items:center;margin-bottom:8px}
.inl input{padding:8px 10px}.inl output{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:13px}
.pro{border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0}
.pro .tt{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;padding:5px 0}
.pro .ttc{background:var(--soft);border-radius:8px;padding:10px 12px;margin-top:6px}
.pro .ttc b{font-size:20px;color:var(--accd)}
:root[data-theme="dark"] .pro .ttc b{color:var(--acc)}
#toast{position:fixed;right:16px;bottom:16px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;z-index:80}
#toast.show{opacity:1;transform:none}
.modal{position:fixed;inset:0;background:rgba(5,10,20,.55);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:70}
.modal .card{width:100%;max-width:760px}
.inv{color:#111;background:#fff;border-radius:10px;padding:28px;font-family:var(--ff)}
.inv table th{background:#eef4ff;color:#3e4947}.inv td,.inv th{border-color:#e2e7ee}
.inv h3{margin:0;font-size:22px;color:#0f766e;font-family:var(--fh)}
.printhead{display:none}
.gate{position:fixed;inset:0;background:var(--bg);z-index:60;overflow:auto;padding:30px 16px}
.gate .logo{color:var(--ink);justify-content:center}.gate .logo small{color:var(--acc)}
.plans{display:grid;gap:14px;grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:8px;max-width:1000px;margin-left:auto;margin-right:auto}
@media (max-width:900px){.plans{grid-template-columns:repeat(3,minmax(0,1fr))}}
.plan.test{border:2px dashed var(--gold)}
.steps{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:0 0 16px;font-size:13px}
.steps span{padding:4px 12px;border-radius:99px;background:var(--soft);color:var(--mut)}
.steps span.on{background:var(--acc);color:#fff}.steps span.fait{background:var(--okbg);color:var(--ok)}
:root[data-theme="dark"] .steps span.on{color:#04201d}
@media (max-width:700px){.plans{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.plans{grid-template-columns:1fr}}
.plan{text-align:center;position:relative;overflow:visible;margin-top:10px}
.plan .prix{font-size:32px;font-weight:700;color:var(--acc);margin:6px 0 2px}
.plan.pop{border:2px solid var(--acc)}
.plan .badge{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--acc);color:#fff;font-size:12px;padding:2px 10px;border-radius:99px;white-space:nowrap}
:root[data-theme="dark"] .plan .badge{color:#04201d}
@media (max-width:1100px){.c2{grid-template-columns:1fr}}
@media (max-width:820px){
 .shell{grid-template-columns:1fr}
 aside{position:sticky;height:auto;padding:8px 10px;flex-direction:column;justify-content:flex-start}
 .logo{padding:2px 6px 8px}.sidefoot{display:none}
 nav{flex-direction:row;overflow-x:auto;padding-bottom:4px}
 .top{padding:10px 16px;position:static}main{padding:16px}
 .f .w2{grid-column:auto}
 .per{width:100%;order:3}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.kpi .v{font-size:19px}.kpi{padding:12px}
 .inl{grid-template-columns:1fr 60px 1fr 30px}.inl output{display:none}
 .hm{display:none!important}
}
@media (max-width:600px){.row.mic{display:none}.row{grid-template-columns:1fr 1fr!important}.row>*:first-child,#lib{grid-column:1/-1}.inv{padding:16px}.nat{grid-template-columns:1fr}}
@media print{
 aside,.top,.noprint,button,#toast,.gate{display:none!important}
 .shell{display:block}main{padding:0;max-width:none}
 .card{border:0;box-shadow:none;padding:0}.c2{display:block}
 .printhead{display:block;margin-bottom:12px}
 body{background:#fff;color:#000}
 body.mopen .shell{display:none}
 .modal{position:static;background:none;padding:0}.modal .card{max-width:none}
}
</style>
</head>
<body>
<div class="shell">
 <aside>
  <div>
   <div class="logo" id="logo"></div>
   <nav id="nav"></nav>
  </div>
  <div class="sidefoot noprint">
   <button class="sidecard hide" id="banner" onclick="go('tarifs')"></button>
   <button class="sidecard" id="entreprise" onclick="go('parametres')"></button>
  </div>
 </aside>
 <div>
  <div class="top">
   <div class="crumb">Comptabilité / <h1 id="titre"></h1></div>
   <div class="per noprint" title="Limite les écritures affichées à cette période">
    <span class="mic">Période</span><input type="date" id="du" onchange="periode()" aria-label="Du"> – <input type="date" id="au" onchange="periode()" aria-label="Au">
    <div class="seg s" id="presets"></div>
   </div>
   <div class="sp"></div>
   <div class="bar noprint" id="actions"></div>
  </div>
  <main id="app"></main>
 </div>
</div>
<div id="modal"></div>
<div id="gate" class="gate hide"></div>
<div id="toast"></div>

<script id="moteur">
// ---------- Moteur comptable ----------
// Calculs purs, sans écran ni stockage : testés par tests/moteur.test.js.
// Les montants restent enregistrés en unités (ex. 1234.5), mais toutes les sommes se font en centimes entiers
// pour éviter les erreurs d'arrondi des nombres à virgule.
const Moteur=(()=>{
  "use strict";
  // 1.005 * 100 vaut 100.4999… en virgule flottante : le petit décalage corrige ce cas.
  const enCentimes=n=>{const v=Number(n);if(!isFinite(v))return 0;return Math.sign(v)*Math.round(Math.abs(v)*100+1e-6)};
  const enUnites=c=>(c||0)/100;
  const arrondir=n=>enUnites(enCentimes(n));
  const classe=c=>String(c)[0];
  const somme=(lignes,k)=>lignes.reduce((a,l)=>a+enCentimes(l[k]||0),0);
  const equilibree=lignes=>somme(lignes,"debit")===somme(lignes,"credit");

  // Contrôle des lignes d'une écriture ; existe(compte) dit si le compte est dans le plan.
  function verifierLignes(L,existe){
    const err=[];
    if(L.length<2)err.push("Au moins deux lignes.");
    L.forEach((l,i)=>{
      const n="Ligne "+(i+1)+" : ";
      if(!l.compte)err.push(n+"compte manquant.");
      else if(existe&&!existe(l.compte))err.push(n+"compte "+l.compte+" absent du plan (vous pouvez l'ajouter dans « Plan comptable »).");
      if(l.debit<0||l.credit<0)err.push(n+"pas de montant négatif.");
      if(l.debit&&l.credit)err.push(n+"mettez soit un débit, soit un crédit, pas les deux.");
      if(!l.debit&&!l.credit)err.push(n+"montant manquant.");
    });
    if(!equilibree(L))err.push("Débit et crédit doivent être égaux.");
    return err;
  }

  // Totaux débit / crédit par compte, recalculés à partir des seules écritures.
  function soldes(ecritures){
    const cts={};
    ecritures.forEach(e=>e.lignes.forEach(l=>{
      const s=cts[l.compte]=cts[l.compte]||{d:0,c:0};
      s.d+=enCentimes(l.debit||0);s.c+=enCentimes(l.credit||0);
    }));
    const s={};
    Object.keys(cts).forEach(c=>s[c]={d:enUnites(cts[c].d),c:enUnites(cts[c].c)});
    return s;
  }
  const sd=(s,c)=>arrondir((s[c]?.d||0)-(s[c]?.c||0));

  function resultat(ecritures){
    let prod=0,ch=0,hao=0;
    ecritures.forEach(e=>e.lignes.forEach(l=>{
      const k=classe(l.compte),net=enCentimes(l.credit||0)-enCentimes(l.debit||0);
      if(k==="7")prod+=net;
      if(k==="6")ch-=net;
      if(k==="8")hao+=net;
    }));
    return {prod:enUnites(prod),ch:enUnites(ch),hao:enUnites(hao),res:enUnites(prod-ch+hao)};
  }

  // Bilan simplifié : chaque compte de classe 1 à 5 va à l'actif ou au passif selon son solde.
  function bilan(ecritures){
    const s=soldes(ecritures),actif=[],passif=[];
    Object.keys(s).sort().forEach(c=>{
      const k=classe(c),v=enCentimes(sd(s,c));
      if("678".includes(k)||v===0)return;
      if(k==="1")passif.push([c,-v]);                  // capitaux, emprunts
      else if(k==="2"||k==="3")actif.push([c,v]);      // immobilisations (amortissements en moins), stocks
      else if(v>0)actif.push([c,v]);                   // créances, trésorerie positive
      else passif.push([c,-v]);                        // dettes, découvert
    });
    const r=enCentimes(resultat(ecritures).res);
    const ta=actif.reduce((a,x)=>a+x[1],0),tp=passif.reduce((a,x)=>a+x[1],0)+r;
    const u=L=>L.map(([c,v])=>[c,enUnites(v)]);
    return {actif:u(actif),passif:u(passif),r:enUnites(r),ta:enUnites(ta),tp:enUnites(tp),equilibre:ta===tp};
  }

  function balance(ecritures){
    const s=soldes(ecritures);let td=0,tc=0;
    const lignes=Object.keys(s).sort().map(c=>{td+=enCentimes(s[c].d);tc+=enCentimes(s[c].c);return {compte:c,d:s[c].d,c:s[c].c,solde:sd(s,c)}});
    return {lignes,td:enUnites(td),tc:enUnites(tc),equilibre:td===tc};
  }

  // Grand livre d'un compte : solde d'ouverture (écritures avant « du »), mouvements de la période, solde courant.
  function grandLivre(ecritures,compte,du,au){
    let ouv=0,solde=0,td=0,tc=0;const mouvements=[];
    [...ecritures].sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>e.lignes.forEach(l=>{
      if(l.compte!==compte)return;
      const d=enCentimes(l.debit||0),c=enCentimes(l.credit||0);
      if(du&&e.date<du){ouv+=d-c;return}
      if(au&&e.date>au)return;
      if(!mouvements.length)solde=ouv;
      solde+=d-c;td+=d;tc+=c;
      mouvements.push({e,l,solde:enUnites(solde)});
    }));
    if(!mouvements.length)solde=ouv;
    return {ouverture:enUnites(ouv),mouvements,td:enUnites(td),tc:enUnites(tc),cloture:enUnites(solde)};
  }

  // Facture de vente sur une ligne : TVA et TTC arrondis au centime.
  function calculFacture(ht,taux){
    const h=enCentimes(ht),tva=Math.round(h*(Number(taux)||0)/100);
    return {ht:enUnites(h),tva:enUnites(tva),ttc:enUnites(h+tva)};
  }
  // Facture sur plusieurs lignes : montant de chaque ligne = quantité × prix unitaire, arrondi au centime.
  function calculFactureLignes(lignes,taux){
    const L=lignes.map(l=>{const qte=Number(l.qte)||0,pu=Number(l.pu)||0,c=Math.round(enCentimes(pu)*qte);return {des:l.des,qte,pu:arrondir(pu),montant:enUnites(c),c}});
    const h=L.reduce((a,l)=>a+l.c,0),tva=Math.round(h*(Number(taux)||0)/100);
    return {lignes:L.map(({c,...l})=>l),ht:enUnites(h),tva:enUnites(tva),ttc:enUnites(h+tva)};
  }
  function lignesFacture({ht,tva,ttc,compte}){
    const L=[{compte:"411",debit:ttc,credit:0},{compte,debit:0,credit:ht}];
    if(enCentimes(tva))L.push({compte:"4431",debit:0,credit:tva});
    return L;
  }

  // ---------- Validation, contrepassation et exercices ----------
  // Une écriture validée ne se modifie plus et ne se supprime plus : on la corrige par contrepassation.
  // Une écriture sans statut (anciennes données) est au brouillard, donc encore modifiable.
  const estValidee=e=>e.statut==="validee";
  // Exercice clôturé qui contient cette date, ou null si la période est ouverte.
  const exerciceClos=(exercices,date)=>(exercices||[]).find(x=>x.cloture&&date>=x.debut&&date<=x.fin)||null;
  // Contrepassation : mêmes comptes et montants, débit et crédit inversés. L'écriture d'origine reste intacte.
  function contrepasser(e,{id,date}){
    return {id,date,piece:e.piece||"",libelle:("Contrepassation : "+e.libelle).slice(0,300),contrepasse:e.id,statut:"validee",valideeLe:date,
      lignes:e.lignes.map(l=>({compte:l.compte,debit:l.credit||0,credit:l.debit||0}))};
  }
  function controleExercice(exercices,x){
    if(!DATE.test(String(x.debut))||!DATE.test(String(x.fin)))return ["Dates de l'exercice invalides."];
    if(x.fin<x.debut)return ["La fin de l'exercice doit être après son début."];
    const autre=(exercices||[]).find(y=>y.id!==x.id&&x.debut<=y.fin&&y.debut<=x.fin);
    return autre?[`Cet exercice chevauche l'exercice du ${autre.debut} au ${autre.fin}.`]:[];
  }
  // Conditions de clôture : toutes les écritures de l'exercice validées, et équilibrées.
  function controleCloture(ecritures,x){
    const dans=ecritures.filter(e=>e.date>=x.debut&&e.date<=x.fin),err=[];
    const b=dans.filter(e=>!estValidee(e)).length;
    if(b)err.push(`${b} écriture(s) de l'exercice sont encore au brouillard : validez-les avant la clôture.`);
    if(!equilibree(dans.flatMap(e=>e.lignes)))err.push("Les écritures de l'exercice ne sont pas équilibrées.");
    return err;
  }

  // Contrôle d'une sauvegarde avant restauration : structure, dates, comptes, montants, équilibre.
  // Les identifiants et numéros sont insérés dans la page : ils doivent rester de simples codes.
  const CODE=/^[A-Za-z0-9_-]{1,40}$/,DATE=/^\d{4}-\d{2}-\d{2}$/,COMPTE=/^[1-9]\d{1,7}$/;
  const montantOk=v=>v===undefined||v===null||(typeof v==="number"&&isFinite(v)&&v>=0);
  function controleSauvegarde(d){
    const err=[];
    if(!d||typeof d!=="object"||!Array.isArray(d.ecritures)||!Array.isArray(d.factures))return ["Ce fichier n'est pas une sauvegarde CompteAssist."];
    d.ecritures.forEach((e,i)=>{
      const n=`Écriture ${i+1} : `;
      if(!e||typeof e!=="object"){err.push(n+"illisible.");return}
      if(e.id!==undefined&&!CODE.test(String(e.id)))err.push(n+"identifiant invalide.");
      if(!DATE.test(String(e.date)))err.push(n+"date invalide.");
      if(e.statut!==undefined&&e.statut!=="brouillon"&&e.statut!=="validee")err.push(n+"statut invalide.");
      if(e.contrepasse!==undefined&&!CODE.test(String(e.contrepasse)))err.push(n+"référence de contrepassation invalide.");
      if(!Array.isArray(e.lignes)||e.lignes.length<2){err.push(n+"au moins deux lignes requises.");return}
      if(e.lignes.some(l=>!l||!COMPTE.test(String(l.compte))))err.push(n+"numéro de compte invalide.");
      if(e.lignes.some(l=>l&&(!montantOk(l.debit)||!montantOk(l.credit))))err.push(n+"montant invalide.");
      else if(!equilibree(e.lignes))err.push(n+"débit et crédit ne sont pas égaux.");
    });
    d.factures.forEach((f,i)=>{
      const n=`Facture ${i+1} : `;
      if(!f||!CODE.test(String(f.num)))err.push(n+"numéro invalide.");
      else if(!["ht","tva","ttc"].every(k=>montantOk(f[k])))err.push(n+"montant invalide.");
    });
    if(d.exercices!==undefined&&(!Array.isArray(d.exercices)||d.exercices.some(x=>!x||!CODE.test(String(x.id))||!DATE.test(String(x.debut))||!DATE.test(String(x.fin))||x.fin<x.debut)))err.push("Exercices comptables : dates ou identifiant invalides.");
    if(d.comptes!==undefined&&(!Array.isArray(d.comptes)||d.comptes.some(c=>!c||!COMPTE.test(String(c.num)))))err.push("Plan comptable : numéro de compte invalide.");
    return err;
  }

  return {enCentimes,enUnites,arrondir,somme,equilibree,verifierLignes,soldes,sd,resultat,bilan,balance,grandLivre,calculFacture,calculFactureLignes,lignesFacture,
    estValidee,exerciceClos,contrepasser,controleExercice,controleCloture,controleSauvegarde};
})();
if(typeof module==="object"&&module.exports)module.exports=Moteur;

        return {A,compte:new A.Account(c),tables:new A.TablesDB(c),fonctions:new A.Functions(c)}};
      if(window.Appwrite)return ok(init());
      const s=document.createElement("script");s.src=SDK;
      s.onload=()=>ok(init());s.onerror=()=>{sdk=null;ko(reseau("Pas de connexion Internet."))};
      document.head.appendChild(s);
    });
    return sdk;
  }
  // Traduit les erreurs courantes d'Appwrite.
  function traduire(e){
    if(e&&(e.reseau||e.statut))return e;
    const code=e&&e.code,m=(e&&e.message)||"",t=(e&&e.type)||"";
    if(!code)return reseau("Pas de connexion Internet.");
    let texte=m||"Erreur du serveur ("+code+").";
    if(t==="user_invalid_credentials"||/invalid credentials/i.test(m))texte="E-mail ou mot de passe incorrect.";
    else if(t==="user_already_exists"||(code===409&&/already exists/i.test(m)))texte="Un compte existe déjà avec cet e-mail : connectez-vous.";
    else if(t==="password_recently_used"||t==="password_personal_data"||(code===400&&/password/i.test(m)))texte="Mot de passe refusé par le serveur : 8 caractères minimum, sans votre nom ni votre e-mail.";
    else if(code===429)texte="Trop d'essais : patientez quelques minutes.";
    else if(code===401)texte="Session expirée : reconnectez-vous.";
    const x=new Error(texte);x.statut=code;return x;
  }
  const appel=async f=>{try{return await f(await charger())}catch(e){throw traduire(e)}};

  // Appel de la fonction serveur, avec un jeton prouvant l'identité de l'utilisateur.
  async function fonction(corps,reessai=true){
    if(!jeton||jeton.fin<Date.now())jeton={v:(await appel(({compte})=>compte.createJWT({duration:900}))).jwt,fin:Date.now()+600000};
    const x=await appel(({fonctions})=>fonctions.createExecution({functionId:APPWRITE.fonction,body:JSON.stringify({...corps,jwt:jeton.v}),async:false}));
    let d=null;try{d=JSON.parse(x.responseBody||"null")}catch(e){}
    const statut=x.responseStatusCode||0;
    if(statut===401&&reessai){jeton=null;return fonction(corps,false)}
    if(statut>=400||x.status==="failed"||!d||typeof d!=="object"){
      const err=new Error((d&&d.erreur)||"Le serveur ne répond pas correctement, réessayez.");err.statut=statut>=400?statut:500;throw err}
    return d;
  }
  async function toutLire(table,limite=500){
    const L=[];let apres=null;
    for(;;){
      const r=await appel(({A,tables})=>{const q=[A.Query.equal("entreprise",[acces.entreprise]),A.Query.limit(limite)];if(apres)q.push(A.Query.cursorAfter(apres));
        return tables.listRows({databaseId:BASE,tableId:table,queries:q})});
      L.push(...r.rows);
      if(r.rows.length<limite||limite<500)return L;apres=r.rows[r.rows.length-1].$id;
    }
  }

  // Forme envoyée au serveur : montants arrondis au centime, champs connus seulement.
  const formeEcriture=e=>({id:e.id,date:e.date,piece:e.piece||"",libelle:e.libelle,lien:e.lien||null,
    statut:Moteur.estValidee(e)?"validee":"brouillon",contrepasse:e.contrepasse||null,
    lignes:e.lignes.map(l=>({compte:String(l.compte),debit:Moteur.arrondir(l.debit||0),credit:Moteur.arrondir(l.credit||0)}))});
  const formeFacture=f=>Object.assign({},f,{ht:Moteur.arrondir(f.ht),tva:Moteur.arrondir(f.tva),ttc:Moteur.arrondir(f.ttc)});
  function photo(d){
    const m={e:{},f:{},c:{},x:{},p:JSON.stringify(d.params)};
    d.ecritures.forEach(e=>m.e[e.id]=JSON.stringify(formeEcriture(e)));
    d.factures.forEach(f=>m.f[f.num]=JSON.stringify(formeFacture(f)));
    d.comptes.forEach(c=>m.c[c.num]=c.nom);
    d.exercices.forEach(x=>m.x[x.id]=JSON.stringify({id:x.id,debut:x.debut,fin:x.fin,cloture:!!x.cloture}));
    return m;
  }

  // Envoie au serveur ce qui a changé depuis le dernier envoi réussi, par paquets.
  async function pousser(){
    if(!connecte())return;
    if(enCours){encore=true;return enCours}
    enCours=(async()=>{
      const a=Object.assign({e:{},f:{},c:{},x:{},p:""},miroir),b=photo(db),ops=[],refus=[];
      const ajout=(type,donnees,fait)=>ops.push({type,donnees,fait});
      for(const id in a.e)if(!(id in b.e))ajout("supprEcriture",{id},()=>delete a.e[id]);
      for(const n in a.f)if(!(n in b.f))ajout("supprFacture",{num:n},()=>delete a.f[n]);
      for(const id in b.e)if(a.e[id]!==b.e[id])ajout("ecriture",JSON.parse(b.e[id]),()=>a.e[id]=b.e[id]);
      for(const n in b.f)if(a.f[n]!==b.f[n])ajout("facture",JSON.parse(b.f[n]),()=>a.f[n]=b.f[n]);
      for(const n in a.c)if(!(n in b.c))ajout("supprCompte",{num:n},()=>delete a.c[n]);
      for(const n in b.c)if(a.c[n]!==b.c[n])ajout("compte",{num:n,nom:b.c[n]},()=>a.c[n]=b.c[n]);
      // Les exercices passent après les écritures : une clôture exige que toutes ses écritures soient validées.
      for(const id in a.x)if(!(id in b.x))ajout("supprExercice",{id},()=>delete a.x[id]);
      for(const id in b.x)if(a.x[id]!==b.x[id])ajout("exercice",JSON.parse(b.x[id]),()=>a.x[id]=b.x[id]);
      if(a.p!==b.p)ajout("params",JSON.parse(b.p),()=>a.p=b.p);
      if(!ops.length){signaler("ok");return}
      signaler("envoi");
      try{
        for(let i=0;i<ops.length;i+=PAQUET){
          const P=ops.slice(i,i+PAQUET);
          const r=await fonction({action:"lot",entreprise:acces.entreprise,operations:P.map(({type,donnees})=>({type,donnees}))});
          r.resultats.forEach((x,j)=>x.ok?P[j].fait():refus.push(x.erreur));
          miroir=a;garderMiroir();
        }
        refus.length?signaler("erreur",(refus.length>1?refus.length+" éléments refusés par le serveur. ":"Refusé par le serveur : ")+refus[0]):signaler("ok");
      }catch(e){
        miroir=a;garderMiroir();
        if(e.statut===401)signaler("erreur","Session expirée : reconnectez-vous pour envoyer vos modifications.");
        else if(e.statut===403)signaler("erreur",e.message);
        else signaler("attente","modifications enregistrées sur cet appareil, envoi dès le retour de la connexion.");
      }
    })();
    try{await enCours}finally{enCours=null;if(encore){encore=false;planifier()}}
  }
  const planifier=()=>{if(!connecte())return;clearTimeout(minuterie);minuterie=setTimeout(pousser,400)};

  // Charge le dossier de l'entreprise depuis le serveur et remplace la copie locale.
  async function tirer(){
    const ent=await appel(({tables})=>tables.getRow({databaseId:BASE,tableId:"entreprises",rowId:acces.entreprise}));
    const [E,F,C,X]=await Promise.all(["ecritures","factures","comptes","exercices"].map(t=>toutLire(t)));
    const unites=c=>Moteur.enUnites(Number(c)||0);
    let params={};try{params=JSON.parse(ent.params||"{}")}catch(e){}
    db=normaliser({
      ecritures:E.map(r=>{const x={id:r.cle,date:r.date,piece:r.piece||"",libelle:r.libelle,
        lignes:JSON.parse(r.lignes||"[]").map(l=>({compte:l.compte,debit:unites(l.debit),credit:unites(l.credit)}))};
        if(r.lien)x.lien=r.lien;if(r.statut==="validee"){x.statut="validee";x.valideeLe=r.valideLe}if(r.contrepasse)x.contrepasse=r.contrepasse;return x})
        .sort((a,b)=>a.date.localeCompare(b.date)),
      factures:F.map(r=>JSON.parse(r.donnees)).sort((a,b)=>a.date.localeCompare(b.date)),
      comptes:C.map(r=>({num:r.cle,nom:r.nom})),
      exercices:X.map(r=>({id:r.cle,debut:r.debut,fin:r.fin,cloture:!!r.cloture,...(r.clotureLe?{clotureLe:r.clotureLe}:{})})),
      params:Object.assign({},params,{societe:ent.nom,pays:ent.pays||"",devise:ent.devise})});
    garderLocal();
    miroir=photo(db);garderMiroir();signaler("ok");
  }

  const vierge=()=>{const c=acces.compte||{},x=pays(c.paysCode)||[];
    return normaliser({ecritures:[],factures:[],comptes:[],params:Object.assign({},PARAMS0,{societe:c.nom||PARAMS0.societe,pays:c.paysCode||"",devise:x[3]||PARAMS0.devise,tel:c.tel||"",email:c.email||""})})};
  const garderLocal=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};

  // Après la connexion : ouvre l'entreprise de l'utilisateur, ou la crée.
  // Les données de ce navigateur ne partent en ligne que si l'utilisateur l'accepte.
  async function ouvrir(){
    const L=(await fonction({action:"mesEntreprises"})).entreprises;
    const lie=miroir&&L.find(m=>m.id===acces.entreprise);
    if(lie){acces.role=lie.role;saveAcces();await pousser();await tirer();return}
    const m=L[0],ne=db.ecritures.length,nf=db.factures.length;let vide=true;
    if(m){
      acces.entreprise=m.id;acces.role=m.role;saveAcces();
      vide=!(await toutLire("ecritures",1)).length&&!(await toutLire("factures",1)).length;
    }
    if(ne+nf)try{localStorage.setItem(KEY+".avant-connexion",JSON.stringify(db))}catch(e){}
    const envoyer=ne+nf>0&&vide&&confirm(`Ce navigateur contient ${ne} écriture(s) et ${nf} facture(s) enregistrées hors ligne.\n\nOK : les ajouter à votre compte en ligne.\nAnnuler : ne pas les envoyer (une copie reste sur cet appareil).`);
    if(m&&!envoyer){miroir=null;await tirer();return}
    if(!envoyer)db=vierge();
    if(!m){
      const p=db.params;if(!p.pays&&acces.compte)p.pays=acces.compte.paysCode||"";
      acces.entreprise=(await fonction({action:"creerEntreprise",donnees:{nom:p.societe||"Mon entreprise",pays:p.pays||"",devise:p.devise||PARAMS0.devise,params:p}})).entreprise;
      acces.role="proprietaire";saveAcces();
    }
    miroir={e:{},f:{},c:{},x:{},p:m?"":JSON.stringify(db.params)};garderLocal();
    await pousser();
  }
  // Modifications pas encore acceptées par le serveur.
  const enAttente=()=>{if(!miroir)return 0;const b=photo(db),a=miroir;let n=0;
    for(const k of ["e","f","c","x"]){const ak=a[k]||{};for(const x in b[k])if(ak[x]!==b[k][x])n++;for(const x in ak)if(!(x in b[k]))n++}
    return n+(a.p!==b.p?1:0)};

  async function ouvrirSession(email,mdp){
    // Une ancienne session restée ouverte empêcherait la nouvelle : on la ferme d'abord.
    try{await (await charger()).compte.deleteSession({sessionId:"current"})}catch(e){}
    jeton=null;
    await appel(({compte})=>compte.createEmailPasswordSession({email,password:mdp}));
  }
  async function inscrire(email,mdp,infos){
    await appel(({A,compte})=>compte.create({userId:A.ID.unique(),email,password:mdp,name:infos.nom}));
    await ouvrirSession(email,mdp);
    try{await appel(({compte})=>compte.updatePrefs({prefs:{tel:infos.tel,pays:infos.pays}}))}catch(e){}
  }
  async function connecter(email,mdp){
    await ouvrirSession(email,mdp);
    const u=await appel(({compte})=>compte.get());
    return {nom:u.name,tel:(u.prefs||{}).tel||"",pays:(u.prefs||{}).pays||""};
  }
  // Déconnexion : les données quittent ce navigateur (elles restent sur le serveur).
  async function deconnecter(){
    clearTimeout(minuterie);
    if(connecte())await pousser();
    const n=enAttente();
    if(n&&!confirm(`${n} modification(s) n'ont pas encore été envoyées au serveur et seront perdues. Se déconnecter quand même ?`))return false;
    try{await (await charger()).compte.deleteSession({sessionId:"current"})}catch(e){}
    try{localStorage.removeItem("cookieFallback")}catch(e){}
    jeton=null;miroir=null;garderMiroir();
    acces.entreprise=null;acces.role=null;db=vierge();garderLocal();signaler("","");
    return true;
  }
  // Au démarrage : envoie ce qui attendait, puis recharge les données du serveur.
  async function demarrer(){
    if(!connecte())return;
    try{await pousser();if(etat.code==="ok")await tirer();if(ui.vue)go(ui.vue)}catch(e){signaler("attente","données de cet appareil affichées.")}
  }
  addEventListener("online",planifier);
  return {actif,connecte,enAttente,planifier,pousser,tirer,ouvrir,inscrire,connecter,deconnecter,demarrer,texteEtat,photo};
})();

// Produits et charges par mois (classes 7 et 6), pour les graphiques.
function parMois(n=6){
  const fin=ui.au||today();let y=+fin.slice(0,4),m=+fin.slice(5,7);const mois=[];
  for(let i=0;i<n;i++){mois.unshift(`${y}-${String(m).padStart(2,"0")}`);if(--m===0){m=12;y--}}
  return mois.map(k=>{const r=Moteur.resultat(db.ecritures.filter(e=>e.date.startsWith(k)));return {k,p:Math.max(r.prod,0),c:Math.max(r.ch,0)}});
}
const NOMS_MOIS=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
function courbe(vals,coul){
  const W=120,H=34,max=Math.max(1,...vals);
  const pts=vals.map((v,i)=>`${(i/(vals.length-1||1)*W).toFixed(1)},${(H-3-v/max*(H-8)).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true"><polygon points="0,${H} ${pts} ${W},${H}" fill="${coul}" opacity=".12"/><polyline points="${pts}" fill="none" stroke="${coul}" stroke-width="2" stroke-linejoin="round"/></svg>`;
}
function graphique(){
  const data=parMois(6),max=Math.max(1,...data.flatMap(d=>[d.p,d.c]));
  const W=640,H=230,bw=30,gx=W/6,enCours=(today().slice(0,7));
  const grille=[0,.5,1].map(t=>`<line x1="0" x2="${W}" y1="${H-26-t*(H-50)}" y2="${H-26-t*(H-50)}" stroke="var(--line)"/>`).join("");
  const bars=data.map((d,i)=>{const x=i*gx+gx/2,hp=d.p/max*(H-50),hc=d.c/max*(H-50),cur=d.k===enCours;
   return `<rect x="${x-bw-3}" y="${H-26-hp}" width="${bw}" height="${hp}" rx="3" fill="var(--accd)"><title>Produits ${fmt(d.p)}</title></rect>
    <rect x="${x+3}" y="${H-26-hc}" width="${bw}" height="${hc}" rx="3" fill="var(--bar2)"><title>Charges ${fmt(d.c)}</title></rect>
    <text x="${x}" y="${H-7}" text-anchor="middle" font-size="12" font-weight="${cur?700:500}" fill="${cur?"var(--acc)":"var(--mut)"}">${NOMS_MOIS[+d.k.slice(5)-1]}${cur?" (en cours)":""}</text>`}).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Produits et charges par mois">${grille}${bars}</svg>`;
}
function donut(parts,total){
  const R=52,C=2*Math.PI*R;let off=0;
  const arcs=parts.map(([v,coul])=>{const l=v/total*C,s=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${coul}" stroke-width="18" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=l;return s}).join("");
  return `<svg viewBox="0 0 140 140" width="170" height="170" role="img" aria-label="Répartition de la trésorerie"><circle r="${R}" cx="70" cy="70" fill="none" stroke="var(--soft)" stroke-width="18"/>${arcs}
   <text x="70" y="64" text-anchor="middle" font-size="9" font-weight="600" fill="var(--mut)">TOTAL</text><text x="70" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">${fmt(total)}</text></svg>`;
}

// Statut affiché dans le journal, et actions permises selon ce statut.
function statutEcriture(e){
  if(clos(e.date))return `<span class="tag" title="Exercice clôturé">${ico("lock",11)} Clôturée</span>`;
  if(!Moteur.estValidee(e))return '<span class="tag warn" title="Encore modifiable">Brouillard</span>';
  return contrepasseePar(e.id)?'<span class="tag" title="Annulée par une contrepassation">Contrepassée</span>':'<span class="tag ok">Validée</span>';
}
function actionsEcriture(e){
  if(clos(e.date)&&!Moteur.estValidee(e))return "";
  if(!Moteur.estValidee(e))return `<button class="btn x" title="Valider (l'écriture ne sera plus modifiable)" onclick="validerEcritures(['${e.id}'])">${ico("check",16)}</button><button class="btn x" title="Modifier" onclick="modifier('${e.id}')">${ico("edit",16)}</button><button class="btn x" title="Supprimer" onclick="supprimer('${e.id}')">${ico("trash",16)}</button>`;
  return e.contrepasse||contrepasseePar(e.id)?"":`<button class="btn x" title="Contrepasser (corriger une écriture validée)" onclick="demanderContrepassation('${e.id}')">${ico("swap",16)}</button>`;
}
const AVIS_VALIDATION="Une écriture validée ne peut plus être modifiée ni supprimée : elle ne se corrige que par contrepassation.";
// Validation : l'écriture entre définitivement au journal.
function validerEcritures(ids){
  const L=db.ecritures.filter(e=>ids.includes(e.id)&&!Moteur.estValidee(e)&&!clos(e.date));if(!L.length)return;
  if(!confirm((L.length===1?`Valider l'écriture « ${L[0].libelle} » ?`:`Valider ${L.length} écritures ?`)+"\n\n"+AVIS_VALIDATION))return;
  const t=today();L.forEach(e=>{e.statut="validee";e.valideeLe=t});
  save();fermer();go("journal");toast(L.length===1?"Écriture validée ✔":L.length+" écritures validées ✔");
}
const brouillard=(jusqua)=>db.ecritures.filter(e=>!Moteur.estValidee(e)&&!clos(e.date)&&(!jusqua||e.date<=jusqua));
function demanderValidation(){
  const b=brouillard();
  if(!b.length){toast("Aucune écriture au brouillard");return}
  ouvrir(`<h2>Valider le brouillard</h2><p class="mut">${AVIS_VALIDATION}</p>

// Contrepassation : annule une écriture validée par une écriture inverse, sans la modifier.
function demanderContrepassation(id){
  const e=db.ecritures.find(x=>x.id===id);if(!e)return;const lien=lienFacture(e);
  const t=today(),d=t<e.date?e.date:t;
  ouvrir(`<h2>Contrepasser l'écriture</h2><p class="mut">« ${esc(e.libelle)} » du ${dfr(e.date)} · ${money(Moteur.enUnites(Moteur.somme(e.lignes,"debit")))}</p>
   <p>Une écriture inverse (débit et crédit échangés) sera passée au journal : elle annule les effets de l'écriture d'origine, qui reste visible.${lien&&lien.type==="facture"?` La facture ${esc(lien.f.num)} passera en « Annulée ».`:lien?` La facture ${esc(lien.f.num)} repassera en « À encaisser ».`:""}</p>
   <div class="f"><div><label>Date de la contrepassation</label><input type="date" id="cpd" value="${d}" min="${esc(e.date)}"></div></div>
   <label class="opt" style="margin-bottom:12px"><input type="checkbox" id="cpc"${lien?"":" checked"}><span><b>Saisir ensuite l'écriture corrigée</b><em>La saisie s'ouvre avec les lignes d'origine, à modifier</em></span></label>
   <div id="cpres"></div>
   <div class="bar"><button class="btn p" onclick="contrepasser('${e.id}')">${ico("swap",16)} Contrepasser</button><button class="btn" onclick="fermer()">Annuler</button></div>`);
}
function contrepasser(id){
  const e=db.ecritures.find(x=>x.id===id),date=$("cpd").value,out=$("cpres");if(!e)return;
  const err=[],lien=lienFacture(e);
  if(!Moteur.estValidee(e))err.push("Seule une écriture validée se contrepasse ; une écriture au brouillard se modifie directement.");
  if(contrepasseePar(e.id))err.push("Cette écriture a déjà été contrepassée.");
  if(!date)err.push("Date requise.");else if(date<e.date)err.push("La contrepassation ne peut pas précéder l'écriture d'origine.");
  if(date&&clos(date))err.push(textClos(date));
  if(lien&&lien.type==="facture"&&lien.f.payee)err.push(`La facture ${esc(lien.f.num)} est déjà encaissée : contrepassez d'abord l'écriture d'encaissement.`);
  if(err.length){out.innerHTML=`<div class="msg bad">${err.join("<br>")}</div>`;return}
  db.ecritures.push(Moteur.contrepasser(e,{id:uid(),date}));
  if(lien&&lien.type==="facture")lien.f.annulee=true;
  if(lien&&lien.type==="encaissement")lien.f.payee=null;
  const corriger=$("cpc").checked;
  save();fermer();toast("Écriture contrepassée ✔");
  if(corriger){modele={libelle:e.libelle,piece:e.piece,lignes:e.lignes};edition=null;go("saisie");$("dt").value=date}
  else go("journal");
}

  if(lien&&lien.type==="facture"&&lien.f.payee){alert(`La facture ${lien.f.num} est déjà encaissée. Supprimez d'abord l'écriture d'encaissement, puis celle de la facture.`);return}
  if(!confirm(`Supprimer l'écriture « ${e.libelle} » du ${dfr(e.date)} ?${lien?`\nLa facture ${lien.f.num} passera en « ${lien.type==="facture"?"Annulée":"À encaisser"} ».`:""}`))return;

// Lien entre une écriture et sa facture (type « facture » ou « encaissement »).
// Les anciennes écritures n'ont pas le champ « lien » : on le retrouve par le n° de pièce et le libellé.
function lienFacture(e){
  if(e.contrepasse)return null;
  const f=db.factures.find(x=>x.num===e.piece);if(!f||f.annulee)return null;
  const type=e.lien||(e.libelle.startsWith("Facture ")?"facture":e.libelle.startsWith("Encaissement ")?"encaissement":null);
  return type?{f,type}:null;
}
const montant411=(L,k)=>Moteur.enUnites(Moteur.somme(L.filter(l=>l.compte==="411"),k));
function verifFacture({f,type},piece,L){
  const err=[];
  if(piece!==f.num)err.push(`Cette écriture est liée à la facture ${esc(f.num)} : gardez le n° de pièce ${esc(f.num)}.`);
  if(type==="facture"){
    const ttc=montant411(L,"debit"),ht=Moteur.enUnites(Moteur.somme(L.filter(l=>classe(l.compte)==="7"),"credit"));
    if(ttc<=0||ht<=0)err.push("L'écriture d'une facture doit garder un débit au compte 411 (client) et un crédit en classe 7 (vente).");
    else if(f.payee&&Math.abs(ttc-f.ttc)>=0.005)err.push(`La facture ${esc(f.num)} est déjà encaissée pour ${money(f.ttc)} : supprimez d'abord l'encaissement pour changer son montant.`);
  }else if(Math.abs(montant411(L,"credit")-f.ttc)>=0.005)err.push(`L'encaissement doit créditer le compte 411 du montant de la facture (${money(f.ttc)}).`);
  return err;
}
function majFacture({f,type},e){
  e.lien=type;
  if(type==="encaissement"){f.payee=e.date;return}
  const L=e.lignes,ventes=L.filter(l=>classe(l.compte)==="7");
  f.date=e.date;
  f.ttc=montant411(L,"debit");
  const tva=L.filter(l=>l.compte==="4431");
  f.ht=Moteur.enUnites(Moteur.somme(ventes,"credit"));
  f.tva=Moteur.enUnites(Moteur.somme(tva,"credit")-Moteur.somme(tva,"debit"));
  // Montant HT modifié à la main : le détail des lignes ne correspond plus, on ne garde que le total.
  if(f.lignes&&Moteur.enUnites(Moteur.somme(f.lignes,"montant"))!==f.ht)f.lignes=null;
  f.taux=f.ht?arr(f.tva/f.ht*100):0;
  f.compte=ventes[0].compte;
  if(e.libelle.startsWith("Facture ")&&e.libelle.slice(8).trim())f.client=e.libelle.slice(8).trim();
}
// Avertit avant qu'une écriture fasse passer la caisse, la banque ou le Mobile Money en négatif à sa date.
function tresoOk(L,date,sauf){
  const s=soldes(db.ecritures.filter(x=>x.id!==sauf&&x.date<=date));
  const neg=TRESO.filter(([c])=>L.some(l=>l.compte===c&&l.credit>0))
    .map(([c,n])=>{const M=L.filter(l=>l.compte===c);return [n,arr(sd(s,c)+Moteur.enUnites(Moteur.somme(M,"debit")-Moteur.somme(M,"credit")))]})
    .filter(x=>x[1]<=-0.005);
  if(!neg.length)return true;
  return confirm(neg.map(([n,v])=>`⚠️ ${n} : le solde passerait à ${fmt(v)} ${db.params.devise} au ${dfr(date)}.`).join("\n")+"\n\nIl n'y a pas assez d'argent sur ce compte à cette date. Enregistrer quand même ?");
}

function facturer(){

function telecharger(nomFichier,contenu,type){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([contenu],{type}));
  a.download=nomFichier;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}

function restaurer(input){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      const err=Moteur.controleSauvegarde(d);
      if(err.length){$("sres").innerHTML=`<div class="msg bad">Sauvegarde refusée, rien n'a été modifié :<br>${err.slice(0,8).map(esc).join("<br>")}${err.length>8?`<br>… et ${err.length-8} autre(s) problème(s).`:""}</div>`;return}
      if(!confirm(`Remplacer les données actuelles par cette sauvegarde (${d.ecritures.length} écriture(s), ${d.factures.length} facture(s)) ?`))return;
      db=normaliser(d);save();go("dashboard");toast("Sauvegarde restaurée ✔");
    }catch(e){$("sres").innerHTML=`<div class="msg bad">Ce fichier n'est pas une sauvegarde CompteAssist valide.</div>`}
    finally{input.value=""}
  };
  r.readAsText(f);
}

const ACCKEY="compteassist.acces",HEURE=3600000,JOUR=86400000;

 {id:"t0",nom:"Test",prix:0,duree:HEURE,detail:"1 heure, une seule fois"},

try{acces=JSON.parse(localStorage.getItem(ACCKEY)||"{}")||{}}catch(e){acces={}}

function resteTexte(){
  const ms=acces.abo.fin-Date.now();
  if(ms<HEURE)return Math.ceil(ms/60000)+" min";
  if(ms<2*JOUR)return Math.ceil(ms/HEURE)+" h";
  return "jusqu'au "+new Date(acces.abo.fin).toLocaleDateString("fr-FR");
}
let payPlan=null;
async function hacher(t){
  try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("compteassist|"+t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
  catch(e){let h=2166136261;for(const ch of "compteassist|"+t){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return "f"+(h>>>0).toString(16)}
}
function etatAcces(){
  const b=$("banner");

    b.innerHTML=`<small>Abonnement</small><div class="row2"><b>Formule ${esc(p.nom)}</b><span class="pill">${ms<2*JOUR?resteTexte():Math.ceil(ms/JOUR)+" j restants"}</span></div>${PAIEMENT_REEL?"":"<small>Mode test : paiement simulé</small>"}`;

    <div class="mut">${p.prix===0?"Pour essayer":"Location"}</div><div style="font-size:18px;font-weight:600">${p.nom}</div>
    <div class="prix">${p.prix} $</div><div class="mut" style="font-size:13px;margin-bottom:12px">${p.detail||`soit ${(p.prix/(p.duree/JOUR)*30).toFixed(2).replace(".",",")} $ par mois`}</div>
    <button class="btn ${p.pop?"p":""}" style="width:100%;justify-content:center"${bloque?" disabled":""} onclick="choisirPlan('${p.id}')">${bloque?"Déjà utilisé":p.prix===0?"Essayer gratuitement":"Choisir"}</button></div>`}).join("")}</div>
   <p class="mut" style="text-align:center;font-size:13px">Toutes les fonctions sont incluses dans chaque formule. Prix en dollars US.</p>`;
}
function choixPaysInscription(){
  const c=$("i_pays").value,t=$("i_tel");
  $("i_ind").textContent=indicatif(c)||"+…";$("i_pnote").innerHTML=notePays(c);
  t.disabled=!c;t.placeholder=c?"Numéro sans l'indicatif":"Choisissez d'abord votre pays";if(c)t.focus();
}
async function inscrire(){
  const v=k=>$("i_"+k).value.trim(),out=$("i_res"),err=[];
  if(!v("nom"))err.push("Nom requis.");
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v("email")))err.push("E-mail invalide.");
  if(!pays(v("pays")))err.push("Choisissez votre pays.");
  else if(!numeroIntl(v("pays"),v("tel")))err.push("Numéro de téléphone invalide pour ce pays (6 à 12 chiffres, sans l'indicatif).");
  const mini=Nuage.actif()?8:6;
  if($("i_mdp").value.length<mini)err.push(`Mot de passe trop court (${mini} caractères minimum).`);
  if($("i_mdp").value!==$("i_mdp2").value)err.push("Les deux mots de passe ne sont pas identiques.");
  if(!Nuage.actif()&&acces.compte&&acces.compte.email===v("email").toLowerCase())err.push("Un compte existe déjà avec cet e-mail : connectez-vous.");
  if(err.length){out.innerHTML=`<div class="msg bad">${err.join("<br>")}</div>`;return}
  if(Nuage.actif()){
    const email=v("email").toLowerCase(),tel=numeroIntl(v("pays"),v("tel"));
    out.innerHTML=`<div class="msg">Création du compte…</div>`;
    try{
      await Nuage.inscrire(email,$("i_mdp").value,{nom:v("nom"),tel,pays:v("pays")});
      acces.compte={nom:v("nom"),email,tel,pays:pays(v("pays"))[1],paysCode:v("pays"),cree:Date.now(),nuage:true};
      acces.connecte=true;saveAcces();
      if(!db.ecritures.length&&!db.params.pays){const x=pays(v("pays"));db.params.pays=x[0];db.params.devise=x[3];if(!db.params.tel)db.params.tel=tel}
      await Nuage.ouvrir();
    }catch(e){out.innerHTML=`<div class="msg bad">${esc(e.message)}</div>`;return}
    toast("Compte créé ✔");afficherPorte("tarifs");return;
  }
  acces.compte={nom:v("nom"),email:v("email").toLowerCase(),tel:numeroIntl(v("pays"),v("tel")),pays:pays(v("pays"))[1],paysCode:v("pays"),mdp:await hacher($("i_mdp").value),cree:Date.now()};
  acces.connecte=true;saveAcces();
  // Premier dossier : le pays et sa devise deviennent les paramètres de l'entreprise (modifiables ensuite).
  if(!db.ecritures.length&&!db.params.pays){const x=pays(v("pays"));db.params.pays=x[0];db.params.devise=x[3];if(!db.params.tel)db.params.tel=acces.compte.tel;save()}
  toast("Compte créé ✔");
  afficherPorte("tarifs");
}
async function connecter(){
  const e=$("c_email").value.trim().toLowerCase();
  if(Nuage.actif()){
    $("c_res").innerHTML=`<div class="msg">Connexion…</div>`;
    try{
      const p=await Nuage.connecter(e,$("c_mdp").value);
      const ancien=acces.compte&&acces.compte.email===e?acces.compte:{};
      acces.compte={nom:p.nom||ancien.nom||e,email:e,tel:p.tel||"",paysCode:p.pays||"",pays:(pays(p.pays)||[])[1]||"",cree:ancien.cree||Date.now(),nuage:true};
      acces.connecte=true;saveAcces();await Nuage.ouvrir();
    }catch(x){$("c_res").innerHTML=`<div class="msg bad">${esc(x.message)}</div>`;return}
  }else{
    const h=await hacher($("c_mdp").value);
    if(!acces.compte||acces.compte.email!==e||acces.compte.mdp!==h){$("c_res").innerHTML=`<div class="msg bad">E-mail ou mot de passe incorrect.</div>`;return}
    acces.connecte=true;saveAcces();
  }
  toast("Connecté ✔");
  if(accesLibre()){$("gate").innerHTML="";go(ui.vue==="tarifs"?"dashboard":ui.vue)}else afficherPorte("tarifs");
}
async function deconnexion(){if(Nuage.connecte()&&!await Nuage.deconnecter())return;acces.connecte=false;payPlan=null;saveAcces();$("gate").innerHTML="";etatAcces();afficherPorte("connexion")}
function choisirPlan(id){
  const p=PLANS.find(x=>x.id===id);if(!p)return;
  if(p.prix===0&&testUtilise())return;
  payPlan=id;$("gate").innerHTML="";etatAcces();afficherPorte("paiement");
}
function formPaiement(){
  const p=PLANS.find(x=>x.id===payPlan);
  const debut=abonneActif()?acces.abo.fin:Date.now();
  const fin=new Date(debut+p.duree);
  const recap=`<div class="hint" style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><span>Formule <b>${esc(p.nom)}</b>${p.detail?` (${p.detail})`:""}</span><b>${p.prix} $</b></div>
   <p class="mut" style="margin:0 0 12px">Accès ${p.duree<JOUR?"pendant 1 heure":"jusqu'au "+fin.toLocaleDateString("fr-FR")}.</p>`;
  if(p.prix===0)return `<h2>Confirmer la formule test</h2>${recap}
   <div class="bar"><button class="btn p" onclick="payer()">Commencer le test gratuit</button><button class="btn" onclick="annulerPaiement()">Retour aux formules</button></div>`;
  return `<h2>Paiement</h2>${recap}
   ${PAIEMENT_REEL?"":`<div class="msg bad" style="margin:0 0 12px">🧪 <b>Mode test</b> : le paiement est simulé, aucun argent n'est prélevé.</div>`}
   <div class="f" style="grid-template-columns:1fr">
    <div><label>Moyen de paiement</label><select id="pm" onchange="$('pz').innerHTML=champPaiement(this.value)">${MOYENS.map(([k,n])=>`<option value="${k}">${n}</option>`).join("")}</select></div>
    <div id="pz">${champPaiement("mpesa")}</div>
   </div>
   <div class="bar"><button class="btn p" onclick="payer()">${PAIEMENT_REEL?"Payer":"Simuler le paiement"} ${p.prix} $</button><button class="btn" onclick="annulerPaiement()">Retour aux formules</button></div><div id="pres"></div>`;
}
const champPaiement=m=>m==="carte"?`<label>Carte bancaire</label><p class="mut" style="margin:0">Vous serez redirigé vers la page sécurisée de paiement par carte.</p>`
  :`<label>Numéro ${esc((MOYENS.find(x=>x[0]===m)||[])[1]||"")}</label><input id="ptel" type="tel" placeholder="${indicatif(acces.compte?.paysCode||db.params.pays)||"+"}…" value="${esc(acces.compte?.tel||"")}"><p class="mut" style="margin:4px 0 0;font-size:13px">Vous recevrez une demande de confirmation sur votre téléphone.</p>`;
function annulerPaiement(){payPlan=null;$("gate").innerHTML="";etatAcces();if(!accesLibre())afficherPorte("tarifs");else go("tarifs")}
function payer(){
  const p=PLANS.find(x=>x.id===payPlan);if(!p)return;
  if(p.prix>0){
    const m=$("pm").value;
    if(m!=="carte"&&($("ptel").value.replace(/\D/g,"").length<8)){$("pres").innerHTML=`<div class="msg bad">Numéro de téléphone invalide.</div>`;return}
    if(PAIEMENT_REEL){$("pres").innerHTML=`<div class="msg bad">Le paiement réel n'est pas encore branché.</div>`;return}
  }
  const debut=abonneActif()?acces.abo.fin:Date.now();
  acces.abo={plan:p.id,fin:debut+p.duree};
  if(p.prix===0)acces.testUtilise=true;
  (acces.paiements=acces.paiements||[]).push({date:Date.now(),plan:p.id,montant:p.prix,moyen:p.prix?$("pm").value:"gratuit",mode:PAIEMENT_REEL?"reel":"test"});
  saveAcces();payPlan=null;$("gate").innerHTML="";
  go(db.ecritures.length?"dashboard":"saisie");
  toast(p.prix?"Paiement confirmé ✔ Bienvenue !":"Test gratuit activé ✔ Bon essai !");
}

// ---------- Navigation ----------
function go(v){
  if(!views[v])v="dashboard";
  if(v!=="saisie")edition=null;
  ui.vue=v;saveUi();fermer();
  const m=MENU.find(x=>x[0]===v);
  $("titre").textContent=m[2];document.title=m[2]+" – CompteAssist";
  $("du").value=ui.du;$("au").value=ui.au;
  const t=today(),pa=!ui.du&&!ui.au?"tout":ui.du===t.slice(0,8)+"01"&&!ui.au?"mois":ui.du===t.slice(0,4)+"-01-01"&&ui.au===t.slice(0,4)+"-12-31"?"annee":"";
  $("presets").innerHTML=[["mois","Ce mois"],["annee","Cette année"],["tout","Tout"]].map(([k,l])=>`<button class="${pa===k?"on":""}" onclick="periodePreset('${k}')">${l}</button>`).join("");
  $("app").innerHTML=views[v]();
  $("nav").innerHTML=MENU.map(x=>`<button class="${x[0]===v?'on':''}" onclick="go('${x[0]}')">${ico(x[1],19)}${x[2]}</button>`).join("");
  const qui=(acces.compte&&acces.compte.nom)||db.params.societe||"?";
  $("actions").innerHTML=`<button class="btn p" onclick="ui.mode='simple';saveUi();go('saisie')">${ico("plus",16)} Écriture</button><button class="btn hm" onclick="go('factures')">${ico("receipt",16)} Facturer</button><button class="ib" id="theme" onclick="basculerTheme()" title="Mode clair / sombre"></button><button class="av" onclick="go('tarifs')" title="Mon compte">${esc(qui.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase())}</button>`;
  appliquerTheme();
  const py=pays(db.params.pays);
  $("entreprise").innerHTML=`<div class="row2">${ico("building",18)}<span style="flex:1;min-width:0"><b style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(db.params.societe)}</b><small>${esc(db.params.devise)}${py?" · "+esc(py[1]):""}</small><span id="nuage">${Nuage.texteEtat()}</span></span></div>`;
  if(v==="journal")jRendu();
  if(v==="factures"){fLigne();apercuFacture()}
  if(v==="saisie"){
    if($("qnat"))qType();
    else{const e=edition&&db.ecritures.find(x=>x.id===edition);
      if(e)e.lignes.forEach(l=>addLigne(l.compte,l.debit||"",l.credit||""));
      else if(modele){modele.lignes.forEach(l=>addLigne(l.compte,l.debit||"",l.credit||""));$("lib").value=modele.libelle;$("pc").value=modele.piece||"";modele=null}
      else{addLigne();addLigne()}tot()}
  }
  window.scrollTo(0,0);
  etatAcces();
}
document.addEventListener("keydown",e=>{if(e.key==="Escape")fermer()});
$("logo").innerHTML=LOGO;
appliquerTheme();
go(accesLibre()?ui.vue:"dashboard");
setInterval(etatAcces,30000);
Nuage.demarrer();
</script>
